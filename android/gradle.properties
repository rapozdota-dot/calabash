# Low-memory Windows development profile. Keep Gradle and Kotlin bounded so
# Flutter builds remain usable on 8 GB machines.
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=600000
org.gradle.caching=true
org.gradle.vfs.watch=true
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
# Kotlin incremental caches fail when plugin sources are in the Pub cache on C:
# and this project is checked out on G:. Keep Gradle caching, but compile Kotlin
# tasks non-incrementally to avoid repeated cache-close failures and disk churn.
kotlin.incremental=false

android.useAndroidX=true
android.enableJetifier=false
android.newDsl=false
