name: Android Live Startup Check

on:
  push:
    branches: [codex/live-startup-fps]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_calabashLiveCheck: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --release --build-number=35 --dart-define=CALABASH_LIVE_DIAGNOSTICS=true
      - uses: actions/upload-artifact@v4
        with:
          name: calabash-live-startup-check
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 7
