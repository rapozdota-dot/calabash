
name: Build Calabash iOS IPA

on:
  # iOS builds are manual-only; normal updates build Android only.
  workflow_dispatch:
    inputs:
      performance_recording:
        description: Record research performance CSV files (enabled by default)
        type: boolean
        required: false
        default: true
      publish_release:
        description: Publish a GitHub Release (leave false for testing artifacts)
        type: boolean
        required: false
        default: false
      device_label:
        description: Optional manually identified device label for CSV (e.g. iPhone 12, 4 GB RAM)
        type: string
        required: false
        default: ""

jobs:
  build-ios:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      CALABASH_PERF_DEVICE: ${{ inputs.device_label }}
      COCOAPODS_DISABLE_STATS: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Boot and verify an available iPhone simulator
        timeout-minutes: 3
        run: |
          set -euo pipefail
          mkdir -p dist
          xcrun simctl list devices available --json > dist/Calabash-simulator-selection.json
          simulator_id=$(python3 tool/ios_smoke.py select-simulator dist/Calabash-simulator-selection.json)
          echo "IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          printf '[%s] Waiting for simulator %s to finish booting\n' "$(date -u +%FT%TZ)" "$simulator_id"
          xcrun simctl bootstatus "$simulator_id" -b 2>&1 | tee dist/Calabash-simulator-boot.log
          printf '[%s] Simulator %s is ready\n' "$(date -u +%FT%TZ)" "$simulator_id"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
          pub-cache: true

      - name: Get Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Analyze project
        run: flutter analyze --no-pub

      - name: Run tests
        run: |
          flutter test --no-pub
          flutter test --no-pub --dart-define=CALABASH_PERF=true test/performance_probe_test.dart

      - name: Validate model metadata and release guards
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py'
          mkdir -p dist
          python3 tool/validate_ios_release.py model assets/model/model.tflite > dist/Calabash-model-metadata.json

      - name: Identify the iOS toolchain
        id: ios-toolchain
        run: |
          set -euo pipefail
          {
            uname -m
            xcodebuild -version
            pod --version
          } | tee dist/Calabash-ios-toolchain.txt
          toolchain_hash=$(shasum -a 256 dist/Calabash-ios-toolchain.txt | awk '{print $1}')
          echo "hash=$toolchain_hash" >> "$GITHUB_OUTPUT"

      - name: Restore CocoaPods downloads
        id: pods-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ios-pods-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.ios-toolchain.outputs.hash }}-${{ hashFiles('ios/Podfile', 'ios/Podfile.lock', 'pubspec.lock') }}

      - name: Configure iOS smoke app and install pods
        timeout-minutes: 12
        run: |
          set -euo pipefail
          printf '[%s] Configuring Flutter XCTest target and CocoaPods\n' "$(date -u +%FT%TZ)"
          flutter build ios --config-only --debug --simulator --no-codesign --no-pub \
            --target=integration_test/model_runtime_smoke_test.dart \
            --dart-define=CALABASH_TFLITE_SMOKE_TRACE=true 2>&1 | tee dist/Calabash-ios-smoke-config.log

      - name: Cache CocoaPods downloads after install
        if: steps.pods-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/CocoaPods
          key: ${{ steps.pods-cache.outputs.cache-primary-key }}

      - name: Build the iOS simulator smoke app
        timeout-minutes: 12
        run: |
          set -euo pipefail
          printf '[%s] Building the simulator app and XCTest bundle\n' "$(date -u +%FT%TZ)"
          xcodebuild build-for-testing -quiet -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -destination-timeout 30 -derivedDataPath "$RUNNER_TEMP/calabash-ios-smoke" \
            2>&1 | tee dist/Calabash-ios-smoke-build.log
          simulator_app="$RUNNER_TEMP/calabash-ios-smoke/Build/Products/Debug-iphonesimulator/Runner.app"
          simulator_model="$simulator_app/Frameworks/App.framework/flutter_assets/assets/model/model.tflite"
          cmp assets/model/model.tflite "$simulator_model"
          model_sha=$(shasum -a 256 "$simulator_model" | awk '{print $1}')
          echo "IOS_SMOKE_MODEL_SHA=$model_sha" >> "$GITHUB_ENV"

      - name: Smoke test the actual iOS TFLite runtime before packaging
        timeout-minutes: 6
        run: |
          set -euo pipefail
          result_bundle="$RUNNER_TEMP/Calabash-model-smoke-${GITHUB_RUN_ATTEMPT}.xcresult"
          diagnostic_dir=dist/Calabash-ios-simulator-diagnostics
          mkdir -p "$diagnostic_dir"
          xcrun simctl spawn "$IOS_SIMULATOR_ID" log stream --level debug --style compact \
            --predicate 'process == "Runner"' > "$diagnostic_dir/runner-live.log" 2>&1 &
          simulator_log_pid=$!
          trap 'kill "$simulator_log_pid" 2>/dev/null || true; wait "$simulator_log_pid" 2>/dev/null || true' EXIT
          printf '[%s] Starting XCTest on simulator %s\n' "$(date -u +%FT%TZ)" "$IOS_SIMULATOR_ID"
          xcodebuild test-without-building -workspace ios/Runner.xcworkspace -scheme Runner \
            -configuration Debug -destination "platform=iOS Simulator,id=$IOS_SIMULATOR_ID" \
            -destination-timeout 30 -derivedDataPath "$RUNNER_TEMP/calabash-ios-smoke" \
            -parallel-testing-enabled NO -resultBundlePath "$result_bundle" \
            2>&1 | tee dist/Calabash-model-smoke.log
          xcrun xcresulttool get test-results tests --path "$result_bundle" > dist/Calabash-model-smoke-results.json
          python3 tool/ios_smoke.py validate-results dist/Calabash-model-smoke-results.json | tee -a dist/Calabash-model-smoke.log

      - name: Collect iOS simulator launch diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 3
        run: |
          diagnostic_dir=dist/Calabash-ios-simulator-diagnostics
          mkdir -p "$diagnostic_dir"
          xcrun simctl list devices --json > "$diagnostic_dir/devices.json" 2>&1 || true
          if [ -n "${IOS_SIMULATOR_ID:-}" ]; then
            xcrun simctl spawn "$IOS_SIMULATOR_ID" log show --last 15m --info --debug --style compact \
              --predicate 'process == "Runner" OR process == "RunnerTests" OR process == "SpringBoard" OR process == "launchd_sim" OR process == "backboardd"' \
              > "$diagnostic_dir/simulator.log" 2>&1 || true
          fi
          crash_reports="$HOME/Library/Logs/DiagnosticReports"
          if [ -d "$crash_reports" ]; then
            find "$crash_reports" -maxdepth 1 -type f -mmin -20 \
              \( -iname '*Runner*.ips' -o -iname '*Runner*.crash' \) \
              -exec cp -p {} "$diagnostic_dir/" \; || true
          fi

      - name: Preserve iOS model smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calabash-ios-model-smoke-${{ github.run_number }}
          path: |
            dist/Calabash-simulator-selection.json
            dist/Calabash-simulator-boot.log
            dist/Calabash-ios-toolchain.txt
            dist/Calabash-ios-smoke-config.log
            dist/Calabash-ios-smoke-build.log
            dist/Calabash-model-smoke.log
            dist/Calabash-model-smoke-results.json
            dist/Calabash-ios-simulator-diagnostics/
            ${{ runner.temp }}/Calabash-model-smoke-*.xcresult/
          if-no-files-found: warn
          retention-days: 14

      - name: Build unsigned iOS app
        env:
          CALABASH_PERF: ${{ inputs.performance_recording && 'true' || 'false' }}
        run: |
          flutter build ios --release --no-codesign --no-pub --target=lib/main.dart --build-number=${{ github.run_number }} \
            --dart-define="CALABASH_PERF=$CALABASH_PERF" \
            --dart-define="CALABASH_SOURCE_REVISION=$GITHUB_SHA" \
            --dart-define="CALABASH_BUILD_NUMBER=$GITHUB_RUN_NUMBER" \
            --dart-define="CALABASH_PERF_DEVICE=$CALABASH_PERF_DEVICE" \
            --dart-define="CALABASH_MODEL_SHA256=$IOS_SMOKE_MODEL_SHA"

      - name: Record source revision
        env:
          CALABASH_PERF: ${{ inputs.performance_recording && 'true' || 'false' }}
        run: |
          mkdir -p dist
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Workflow: $GITHUB_WORKFLOW"
            echo "Run: $GITHUB_RUN_ID"
            echo "Ref: $GITHUB_REF"
            echo "Branch or tag: $GITHUB_REF_NAME"
            echo "Commit: $GITHUB_SHA"
            echo "Build number: $GITHUB_RUN_NUMBER"
            echo "Performance recording: $CALABASH_PERF"
            echo "Recording define: CALABASH_PERF=$CALABASH_PERF"
            echo "Device label (manually supplied): $CALABASH_PERF_DEVICE"
            echo "Simulator XCTest: startup, photo TFLite and live worker TFLite passed"
            echo "Physical iPhone validation: not performed by this workflow"
            echo "Model SHA-256: $IOS_SMOKE_MODEL_SHA"
          } > dist/Calabash-source-info.txt

      - name: Package IPA
        run: |
          mkdir -p package/Payload
          mkdir -p dist
          cp -R build/ios/iphoneos/Runner.app package/Payload/
          cd package
          zip -qry ../dist/Calabash-unsigned.ipa Payload

      - name: Validate IPA structure, app identity, build number, and bundled model
        run: |
          python3 tool/validate_ios_release.py ipa dist/Calabash-unsigned.ipa \
            --bundle-id com.example.calabashMaturityDetection \
            --build-number "$GITHUB_RUN_NUMBER" --model-sha256 "$IOS_SMOKE_MODEL_SHA" \
            > dist/Calabash-ipa-validation.json

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: calabash-ios-unsigned-${{ github.run_number }}
          path: |
            dist/Calabash-unsigned.ipa
            dist/Calabash-source-info.txt
            dist/Calabash-model-metadata.json
            dist/Calabash-model-smoke.log
            dist/Calabash-model-smoke-results.json
            dist/Calabash-ipa-validation.json
          if-no-files-found: error
          retention-days: 14

      - name: Name iOS release
        if: ${{ inputs.publish_release }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          echo "IOS_RELEASE_NAME=Calabash v${version} - iOS Build ${GITHUB_RUN_NUMBER} - ${GITHUB_REF_NAME} - Unsigned IPA" >> "$GITHUB_ENV"

      - name: Publish downloadable iOS release
        if: ${{ inputs.publish_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.IOS_RELEASE_NAME }}
          body: |
            Calabash Maturity Detection for iOS.

            Download Calabash-unsigned.ipa from Assets below.
            This IPA is unsigned and must be signed before installation on an iPhone.
            This is not a TestFlight or App Store build.

            Ref: ${{ github.ref }}
            Branch or tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Performance recording: ${{ inputs.performance_recording && 'true' || 'false' }}
          files: |
            dist/Calabash-unsigned.ipa
            dist/Calabash-source-info.txt
            dist/Calabash-model-metadata.json
            dist/Calabash-model-smoke.log
            dist/Calabash-model-smoke-results.json
            dist/Calabash-ipa-validation.json
          fail_on_unmatched_files: true
          make_latest: false
