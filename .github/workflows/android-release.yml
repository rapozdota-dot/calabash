name: Android APK Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub Release for this APK
        required: true
        default: "true"
        type: choice
        options:
          - "false"
          - "true"
      release_name:
        description: Optional descriptive release title (version and build are added automatically)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze project
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Prepare APK asset
        run: |
          safe_ref="${GITHUB_REF_NAME//\//-}"
          apk_name="calabash-maturity-detection-${safe_ref}-${GITHUB_RUN_NUMBER}.apk"
          mkdir -p release
          test -f build/app/outputs/flutter-apk/app-release.apk
          cp build/app/outputs/flutter-apk/app-release.apk "release/${apk_name}"
          echo "APK_NAME=${apk_name}" >> "${GITHUB_ENV}"
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: calabash-maturity-detection-apk-${{ github.run_number }}
          path: release/*.apk
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-apk
    if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Name release
        env:
          CUSTOM_TITLE: ${{ inputs.release_name }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          title="${CUSTOM_TITLE:-$(git log -1 --format=%s)}"
          echo "RELEASE_NAME=Calabash v${version} - Build ${GITHUB_RUN_NUMBER} - ${title}" >> "$GITHUB_ENV"

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: calabash-maturity-detection-apk-${{ github.run_number }}
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            Automated Android APK build for Calabash Maturity Detection.

            Commit: ${{ github.sha }}
            Includes the bundled offline model and live detection.
          files: release/*.apk
          make_latest: true
